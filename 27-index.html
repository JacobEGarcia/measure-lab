<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOPSPIN - CV tennis trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0a0f0a;color:#b8ffb8;font-family:'JetBrains Mono',monospace;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;color:#5da;opacity:.8;text-align:center;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">ARROWS / A D move &nbsp; SPACE swing (timing = power) &nbsp; hold LEFT/RIGHT while swinging to aim &nbsp; first to 11</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',rs);rs();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const state={mode:'title',ps:0,cs:0,rally:0,frame:0,rec:0,session:[],msg:'',msgT:0,lastShot:null,serveT:0};
const P={x:0,y:.86,vx:0,swing:0,swingT:0,side:'FOREHAND',conf:.97};
const A={x:0,y:.14,vx:0,swing:0,err:.06,level:1};
const B={x:0,y:.5,vx:0,vy:0,speed:0,spin:0,live:false};
const courtX=t=> (t-.5)*Math.min(W,760);      // logical -0.5..0.5 -> px
const courtY=t=> H*.06+t*H*.84;
const scaleY=y=> .45+.55*y;                    // perspective

function reset(dir){B.x=(Math.random()-.5)*.3;B.y=dir>0?.8:.2;B.vy=0;B.vx=0;B.live=false;state.serveT=90;state.serveDir=dir;state.rally=0;}
function msg(t,fr){state.msg=t;state.msgT=fr||90;}

function hitBall(who,targetX,quality){
  const from=who===P?1:-1;
  B.vy=-from*(0.011+0.009*quality)*(1+state.rally*0.02);
  B.vx=(targetX-B.x)*0.018*(0.6+quality*0.6);
  B.speed=Math.round(48+quality*62+state.rally*2);
  B.live=true;state.rally++;
}
function log(shot){state.session.unshift(shot);if(state.session.length>7)state.session.pop();}

function update(){
  state.frame++;state.rec=(state.rec+1)%60;if(state.msgT>0)state.msgT--;
  if(state.mode==='title'){if(keys[' ']||keys['enter']){state.mode='play';state.ps=0;state.cs=0;state.session=[];reset(1);}return;}
  if(state.mode==='over'){if(keys['enter']){state.mode='title';}return;}
  // player move
  const spd=0.011;
  if(keys['arrowleft']||keys['a'])P.x-=spd;
  if(keys['arrowright']||keys['d'])P.x+=spd;
  P.x=Math.max(-.42,Math.min(.42,P.x));
  if(P.swingT>0)P.swingT--;
  // swing
  if(keys[' ']&&P.swingT<=0){P.swingT=16;P.swing=true;
    const near=Math.abs(B.y-.86)<.075&&Math.abs(B.x-P.x)<.09&&B.vy>0;
    if(near){
      const timing=1-Math.abs(B.y-.86)/.075;
      const aim=(keys['arrowleft']||keys['a'])?-0.34:(keys['arrowright']||keys['d'])?0.34:(A.x+(Math.random()-.5)*.3);
      P.side=B.x>P.x?'FOREHAND':'BACKHAND';
      hitBall(P,aim,0.45+timing*0.55);
      P.conf=.86+Math.random()*.13;
      log({t:state.frame,side:P.side,mph:B.speed,q:Math.round((0.45+timing*0.55)*100)});
      msg(P.side+' '+B.speed+' mph',50);
      A.err=Math.max(.02,.09-state.ps*.006);
    }
  }
  // AI
  const aiSpd=.0085+A.level*.0008;
  const want=B.vy<0?B.x+B.vx*8:0;
  A.x+=Math.max(-aiSpd,Math.min(aiSpd,want-A.x));
  A.x=Math.max(-.42,Math.min(.42,A.x));
  if(A.swingT>0)A.swingT--;
  if(B.vy<0&&Math.abs(B.y-.14)<.06&&Math.abs(B.x-A.x)<.085){
    A.swingT=14;
    const miss=Math.random()<A.err;
    if(miss){B.live=false;state.ps++;msg('OPPONENT ERROR  +1',70);afterPoint(1);}
    else{
      const aim=P.x+(Math.random()<.35?(Math.random()<.5?-.2:.2):(Math.random()-.5)*.15);
      hitBall(A,Math.max(-.4,Math.min(.4,aim)),.5+Math.random()*.5);
    }
  }
  // ball
  if(state.serveT>0){state.serveT--;if(state.serveT===0){B.live=true;B.vy=(state.serveDir>0?-1:1)*.014;B.vx=(Math.random()-.5)*.006;B.speed=58;}}
  if(B.live){
    B.x+=B.vx;B.y+=B.vy;
    if(Math.abs(B.x)>.45){B.vx*=-.85;B.x=Math.max(-.45,Math.min(.45,B.x));}
    if(B.y>1.02){B.live=false;state.cs++;msg('OUT - point opponent',70);afterPoint(-1);}
    if(B.y<-.02){B.live=false;state.ps++;msg('WINNER  +1',70);afterPoint(1);}
  }
}
function afterPoint(d){
  A.level=1+Math.floor((state.ps+state.cs)/4);
  if(state.ps>=11&&state.ps-state.cs>=2){state.mode='over';state.win=true;}
  else if(state.cs>=11&&state.cs-state.ps>=2){state.mode='over';state.win=false;}
  else reset(d);
}
function box(x,y,w,h,label,color){
  cx.strokeStyle=color;cx.lineWidth=1.5;cx.strokeRect(x,y,w,h);
  cx.fillStyle=color;cx.font='11px Courier New';
  const tw=cx.measureText(label).width;
  cx.fillRect(x,y-14,tw+8,14);cx.fillStyle='#041004';cx.fillText(label,x+4,y-3);
}
function stick(x,y,s,color,swing){
  cx.strokeStyle=color;cx.lineWidth=2;
  cx.beginPath();cx.arc(x,y-34*s,7*s,0,7);cx.stroke();            // head
  cx.beginPath();cx.moveTo(x,y-27*s);cx.lineTo(x,y-8*s);cx.stroke(); // torso
  cx.beginPath();cx.moveTo(x,y-8*s);cx.lineTo(x-8*s,y+8*s);cx.moveTo(x,y-8*s);cx.lineTo(x+8*s,y+8*s);cx.stroke(); // legs
  const a=swing?-.9:.5;
  cx.beginPath();cx.moveTo(x,y-24*s);cx.lineTo(x+14*s*Math.cos(a),y-24*s+14*s*Math.sin(a));cx.stroke(); // arm+racket dir
  cx.beginPath();cx.moveTo(x,y-24*s);cx.lineTo(x-10*s,y-14*s);cx.stroke();
}
function drawCourt(){
  cx.fillStyle='#0d1f10';cx.fillRect(0,0,W,H);
  cx.strokeStyle='#2e7d43';cx.lineWidth=2;
  const L=courtX(-.45)+W/2-W/2; // helper unused
  const x1=W/2+courtX(-.45)*.8,x2=W/2+courtX(.45)*.8;
  // trapezoid court
  cx.beginPath();
  cx.moveTo(W/2+courtX(-.45)*.55,courtY(0));cx.lineTo(W/2+courtX(.45)*.55,courtY(0));
  cx.lineTo(W/2+courtX(.45),courtY(1));cx.lineTo(W/2+courtX(-.45),courtY(1));cx.closePath();cx.stroke();
  // net
  cx.strokeStyle='#9fe8b0';cx.beginPath();cx.moveTo(W/2+courtX(-.5)*.78,courtY(.5));cx.lineTo(W/2+courtX(.5)*.78,courtY(.5));cx.stroke();
  // service lines
  cx.strokeStyle='rgba(120,220,140,.35)';
  for(const t of[.25,.75]){cx.beginPath();cx.moveTo(W/2+courtX(-.45)*(.55+.45*Math.abs(t-.5)*2)*1,courtY(t));cx.lineTo(W/2+courtX(.45)*(.55+.45*Math.abs(t-.5)*2)*1,courtY(t));cx.stroke();}
  cx.beginPath();cx.moveTo(W/2,courtY(.25));cx.lineTo(W/2,courtY(.75));cx.stroke();
}
function draw(){
  drawCourt();
  // detections
  const as=scaleY(A.y)*1.4,ps=scaleY(P.y)*1.4;
  const axp=W/2+courtX(A.x)*(.55+.45*A.y),ayp=courtY(A.y);
  const pxp=W/2+courtX(P.x)*(.55+.45*P.y),pyp=courtY(P.y);
  stick(axp,ayp,as,'#ff9f43',A.swingT>6);
  box(axp-26*as,ayp-52*as,52*as,64*as,'player_2 '+(A.swingT>0?'STROKE':'READY')+' 0.'+(88+(state.frame%9)),'#ff9f43');
  stick(pxp,pyp,ps,'#4dd2ff',P.swingT>6);
  box(pxp-26*ps,pyp-52*ps,52*ps,64*ps,'player_1 '+(P.swingT>0?P.side:'READY')+' '+P.conf.toFixed(2),'#4dd2ff');
  if(B.live||state.serveT>0){
    const bs=4+6*scaleY(B.y),bx=W/2+courtX(B.x)*(.55+.45*B.y),by=courtY(B.y);
    cx.fillStyle='#eaffea';cx.beginPath();cx.arc(bx,by,bs,0,7);cx.fill();
    box(bx-14,by-14,28,28,'ball '+(B.speed||58)+'mph 0.9'+(state.frame%10),'#eaff2e');
  }
  // HUD chrome
  cx.fillStyle='#b8ffb8';cx.font='13px Courier New';
  cx.fillText('● REC',20,26);
  cx.fillText('frame '+String(state.frame).padStart(6,'0'),20,44);
  cx.fillText('RF-DETR sports-ball  |  pose: movenet  |  session.db',20,62);
  cx.font='bold 30px Courier New';
  cx.fillText(state.ps,W/2-46,44);cx.fillText('-',W/2-8,44);cx.fillText(state.cs,W/2+24,44);
  cx.font='11px Courier New';cx.fillText('YOU',W/2-48,60);cx.fillText('CPU',W/2+22,60);
  if(state.msgT>0){cx.font='bold 22px Courier New';cx.fillStyle='#eaff2e';cx.textAlign='center';cx.fillText(state.msg,W/2,H*.5-40);cx.textAlign='left';}
  // session log
  cx.font='11px Courier New';cx.fillStyle='#7ee2a0';
  cx.fillText('session log (local db):',W-220,26);
  state.session.forEach((s,i)=>cx.fillText('#'+s.t+' '+s.side+' '+s.mph+'mph q'+s.q,W-220,44+i*15));
  if(state.mode==='title'){
    cx.fillStyle='rgba(4,16,4,.78)';cx.fillRect(0,0,W,H);
    cx.textAlign='center';cx.fillStyle='#b8ffb8';
    cx.font='bold 54px Courier New';cx.fillText('TOPSPIN',W/2,H*.34);
    cx.font='15px Courier New';
    cx.fillText('a tennis trainer that watches every stroke',W/2,H*.34+34);
    cx.fillText('the model calls your forehands, clocks your ball speed, and logs the session',W/2,H*.34+58);
    cx.fillStyle='#eaff2e';cx.font='bold 18px Courier New';
    cx.fillText('press SPACE to start practice',W/2,H*.62);
    cx.textAlign='left';
  }
  if(state.mode==='over'){
    cx.fillStyle='rgba(4,16,4,.82)';cx.fillRect(0,0,W,H);
    cx.textAlign='center';cx.fillStyle=state.win?'#eaff2e':'#ff6b6b';
    cx.font='bold 44px Courier New';cx.fillText(state.win?'SESSION: PASSED':'SESSION: NEEDS WORK',W/2,H*.4);
    cx.fillStyle='#b8ffb8';cx.font='16px Courier New';
    cx.fillText(state.ps+' - '+state.cs+'   |   '+state.session.length+' strokes analyzed',W/2,H*.4+36);
    cx.fillText('ENTER to run it back',W/2,H*.4+66);cx.textAlign='left';
  }
}
(function loop(){update();draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
