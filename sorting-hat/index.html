<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SORTING HAT - animated pixel-sort glitch lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0b10;color:#cfd2ff;font-family:'JetBrains Mono',monospace;overflow:hidden}
  #wrap{display:flex;height:100%}
  #side{width:230px;padding:14px;background:#12121c;font-size:12px;line-height:1.5;box-sizing:border-box;overflow-y:auto}
  canvas{flex:1;object-fit:contain;background:#000;width:calc(100% - 230px);height:100%}
  button,label{display:block;width:100%;margin:6px 0;background:#1c1c2e;color:#cfd2ff;border:1px solid #3c3c66;border-radius:4px;padding:7px;font-family:inherit;font-size:12px;cursor:pointer;box-sizing:border-box}
  input[type=range]{width:100%}
  h1{font-size:16px;margin:0 0 4px}
  .val{color:#8f92c9}
</style>
</head>
<body>
<div id="wrap">
<div id="side">
  <h1>SORTING HAT</h1>
  <div>watch an image re-sort itself into glitch ribbons, forever</div>
  <label>upload image<input id="file" type="file" accept="image/*" style="display:none"></label>
  <button id="sample">regenerate sample</button>
  threshold <span class="val" id="tv">90</span><input id="th" type="range" min="20" max="220" value="90">
  angle <span class="val" id="av">0</span><input id="an" type="range" min="0" max="314" value="0">
  streak <span class="val" id="sv">40</span><input id="st" type="range" min="8" max="140" value="40">
  speed <span class="val" id="pv">3</span><input id="sp" type="range" min="1" max="10" value="3">
  <button id="export">export png</button>
</div>
<canvas id="c"></canvas>
</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const work=document.createElement('canvas'),wx=work.getContext('2d');
const SW=520,SH=340;work.width=SW;work.height=SH;
function fit(){cv.width=cv.clientWidth;cv.height=cv.clientHeight}
addEventListener('resize',fit);
let base;
function sample(){
  // generative gradient-blob sample so the tool works with no upload
  const g=wx.createLinearGradient(0,0,SW,SH);
  const hue=Math.random()*360;
  g.addColorStop(0,'hsl('+hue+',80%,55%)');g.addColorStop(.5,'hsl('+(hue+90)+',70%,45%)');g.addColorStop(1,'hsl('+(hue+200)+',85%,60%)');
  wx.fillStyle=g;wx.fillRect(0,0,SW,SH);
  for(let i=0;i<26;i++){
    wx.fillStyle='hsla('+(hue+Math.random()*160)+',90%,'+(30+Math.random()*50)+'%,.75)';
    wx.beginPath();wx.arc(Math.random()*SW,Math.random()*SH,12+Math.random()*70,0,7);wx.fill();
  }
  for(let i=0;i<10;i++){
    wx.strokeStyle='rgba(255,255,255,.35)';wx.lineWidth=2+Math.random()*6;
    wx.beginPath();wx.moveTo(Math.random()*SW,Math.random()*SH);
    wx.bezierCurveTo(Math.random()*SW,Math.random()*SH,Math.random()*SW,Math.random()*SH,Math.random()*SW,Math.random()*SH);wx.stroke();
  }
  base=wx.getImageData(0,0,SW,SH);
}
function sortPass(th,streak){
  const img=wx.getImageData(0,0,SW,SH),d=img.data;
  const lum=(r,g,b)=>.299*r+.587*g+.114*b;
  for(let y=0;y<SH;y++){
    let x=0;
    while(x<SW){
      const i0=(y*SW+x)*4;
      if(lum(d[i0],d[i0+1],d[i0+2])<th){x++;continue;}
      let x2=x;
      while(x2<SW&&x2-x<streak){const i=(y*SW+x2)*4;if(lum(d[i],d[i+1],d[i+2])<th)break;x2++;}
      // sort segment by luminance (descending)
      const seg=[];
      for(let k=x;k<x2;k++){const i=(y*SW+k)*4;seg.push([lum(d[i],d[i+1],d[i+2]),d[i],d[i+1],d[i+2]]);}
      seg.sort((a,b)=>b[0]-a[0]);
      for(let k=0;k<seg.length;k++){const i=(y*SW+x+k)*4;d[i]=seg[k][1];d[i+1]=seg[k][2];d[i+2]=seg[k][3];}
      x=x2+1;
    }
  }
  wx.putImageData(img,0,0);
}
document.getElementById('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{
    wx.fillStyle='#000';wx.fillRect(0,0,SW,SH);
    const s=Math.min(SW/im.width,SH/im.height);
    wx.drawImage(im,(SW-im.width*s)/2,(SH-im.height*s)/2,im.width*s,im.height*s);
    base=wx.getImageData(0,0,SW,SH);
  };im.src=URL.createObjectURL(f);
};
document.getElementById('sample').onclick=sample;
document.getElementById('export').onclick=()=>{
  const a=document.createElement('a');a.download='sorting-hat.png';a.href=work.toDataURL();a.click();
};
const th=document.getElementById('th'),an=document.getElementById('an'),st=document.getElementById('st'),sp=document.getElementById('sp');
th.oninput=()=>document.getElementById('tv').textContent=th.value;
an.oninput=()=>document.getElementById('av').textContent=Math.round(an.value*57.3);
st.oninput=()=>document.getElementById('sv').textContent=st.value;
sp.oninput=()=>document.getElementById('pv').textContent=sp.value;
sample();
let f=0;
(function loop(){
  f++;
  if(f%Math.max(1,11-+sp.value)===0){
    // slowly re-sort from base + decay so it never fully settles
    if(f%240===0){wx.putImageData(base,0,0);
      wx.save();wx.translate(SW/2,SH/2);wx.rotate(+an.value/100);wx.translate(-SW/2,-SH/2);
      wx.globalAlpha=.06;wx.drawImage(work,-2,1);wx.restore();wx.globalAlpha=1;}
    sortPass(+th.value,+st.value);
    // drift
    wx.save();wx.globalAlpha=.012;wx.drawImage(work,1,0);wx.restore();wx.globalAlpha=1;
  }
  fit();
  cx.fillStyle='#000';cx.fillRect(0,0,cv.width,cv.height);
  const s=Math.min(cv.width/SW,cv.height/SH);
  cx.imageSmoothingEnabled=false;
  cx.drawImage(work,(cv.width-SW*s)/2,(cv.height-SH*s)/2,SW*s,SH*s);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
