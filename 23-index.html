<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORBITAL - conduct a nebula with your hands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#030308;overflow:hidden;font-family:'JetBrains Mono',monospace}
  canvas{display:block;width:100vw;height:100vh}
  #ui{position:fixed;top:14px;left:14px;color:#8fa3ff;font-size:12px;line-height:1.6;pointer-events:none;text-shadow:0 0 6px #224}
  #cam{position:fixed;bottom:14px;right:14px;width:180px;height:135px;border:1px solid #334;transform:scaleX(-1);border-radius:6px;opacity:.85}
  #msg{position:fixed;bottom:16px;left:14px;color:#5b6cff;font-size:12px}
  button{background:#101430;color:#9fb0ff;border:1px solid #3a46a0;border-radius:4px;padding:6px 10px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">ORBITAL<br>hands = gravity wells<br>left hand attracts / right hand repels<br>pinch thumb+index = shockwave + note<br><span id="mode">mouse mode: drag = attract, right-drag = repel, click = pulse</span></div>
<video id="cam" autoplay playsinline muted style="display:none"></video>
<div id="msg"><button id="camBtn">enable hand tracking</button> <span id="st"></span></div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',rs);rs();
const N=1400,parts=[];
for(let i=0;i<N;i++){const a=Math.random()*7,r=60+Math.random()*Math.min(W,H)*.42;
  parts.push({x:W/2+Math.cos(a)*r,y:H/2+Math.sin(a)*r,vx:0,vy:0,hue:200+Math.random()*120,s:Math.random()*1.6+.4});}
let wells=[]; // {x,y,k} k>0 attract k<0 repel
let pulses=[];
let audioOn=false,synth=null;
async function note(h){
  try{
    if(!synth){await Tone.start();synth=new Tone.FMSynth({harmonicity:3,modulationIndex:8,envelope:{attack:.005,decay:.3,sustain:0,release:.6}}).connect(new Tone.Reverb(3).toDestination());}
    const scale=[0,3,5,7,10,12,15,17];
    const f=220*Math.pow(2,scale[Math.floor(h*scale.length)%scale.length]/12);
    synth.triggerAttackRelease(f,'8n');audioOn=true;
  }catch(e){}
}
// mouse fallback
let md=false,mr=false,mx=W/2,my=H/2;
cv.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
cv.addEventListener('mousedown',e=>{if(e.button===2){mr=true}else{md=true;pulses.push({x:mx,y:my,r:0});note(my/H)}});
addEventListener('mouseup',()=>{md=false;mr=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('touchstart',e=>{const t=e.touches[0];pulses.push({x:t.clientX,y:t.clientY,r:0});note(t.clientY/H);e.preventDefault()},{passive:false});
cv.addEventListener('touchmove',e=>{const t=e.touches[0];mx=t.clientX;my=t.clientY;md=true;e.preventDefault()},{passive:false});
cv.addEventListener('touchend',()=>md=false);

// mediapipe hands (optional)
const st=document.getElementById('st');
document.getElementById('camBtn').onclick=async function(){
  this.disabled=true;st.textContent=' loading model...';
  try{
    const video=document.getElementById('cam');
    const hands=new Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});
    hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});
    let lastPinch=0;
    hands.onResults(res=>{
      wells=[];
      if(res.multiHandLandmarks)res.multiHandLandmarks.forEach((lm,i)=>{
        const hand=res.multiHandedness[i].label; // 'Left'/'Right' (mirrored)
        const x=(1-lm[9].x)*W,y=lm[9].y*H;
        wells.push({x,y,k:hand==='Left'?1:-1});
        const d=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);
        if(d<.045&&performance.now()-lastPinch>260){lastPinch=performance.now();
          pulses.push({x:(1-lm[8].x)*W,y:lm[8].y*H,r:0});note(lm[8].y);}
      });
    });
    const cam=new Camera(video,{onFrame:async()=>{await hands.send({image:video})},width:320,height:240});
    await cam.start();
    video.style.display='block';st.textContent=' hands live';document.getElementById('camBtn').style.display='none';
    document.getElementById('mode').textContent='hand mode: move hands to bend the nebula';
  }catch(e){st.textContent=' camera unavailable - mouse mode';this.disabled=false;}
};
function step(){
  const eff=wells.length?wells:(md?[{x:mx,y:my,k:1}]:(mr?[{x:mx,y:my,k:-1}]:[]));
  for(const p of parts){
    // gentle orbit around center
    const dx0=W/2-p.x,dy0=H/2-p.y,d0=Math.hypot(dx0,dy0)+40;
    p.vx+=dx0/d0*.012;p.vy+=dy0/d0*.012;
    for(const w of eff){
      const dx=w.x-p.x,dy=w.y-p.y,d2=dx*dx+dy*dy+900,d=Math.sqrt(d2);
      const f=w.k*1400/d2;p.vx+=dx/d*f*8;p.vy+=dy/d*f*8;
    }
    for(const pu of pulses){
      const dx=p.x-pu.x,dy=p.y-pu.y,d=Math.hypot(dx,dy)+1;
      const band=Math.abs(d-pu.r);if(band<40){const f=(1-band/40)*2.4;p.vx+=dx/d*f;p.vy+=dy/d*f;}
    }
    p.vx*=.965;p.vy*=.965;p.x+=p.vx;p.y+=p.vy;
    if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
  }
  pulses.forEach(p=>p.r+=9);pulses=pulses.filter(p=>p.r<Math.max(W,H));
}
function draw(){
  cx.fillStyle='rgba(3,3,10,.28)';cx.fillRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';
  for(const p of parts){
    const sp=Math.hypot(p.vx,p.vy);
    cx.fillStyle='hsla('+((p.hue+sp*30)%360)+',90%,'+(45+Math.min(30,sp*20))+'%,.8)';
    cx.fillRect(p.x,p.y,p.s,p.s);
  }
  for(const w of wells){
    cx.strokeStyle=w.k>0?'rgba(120,255,180,.5)':'rgba(255,120,160,.5)';
    cx.beginPath();cx.arc(w.x,w.y,16,0,7);cx.stroke();
    cx.beginPath();cx.arc(w.x,w.y,5,0,7);cx.stroke();
  }
  for(const pu of pulses){cx.strokeStyle='rgba(160,180,255,'+(1-pu.r/Math.max(W,H))+')';cx.beginPath();cx.arc(pu.x,pu.y,pu.r,0,7);cx.stroke();}
  cx.globalCompositeOperation='source-over';
}
(function loop(){step();draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
